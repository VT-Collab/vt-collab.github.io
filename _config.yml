  name: Collaborative Robotics Lab (Collab), Virginia Tech
  links:
    - https://www.youtube.com/@collab-robotics
    - https://github.com/VT-Collab
    - https://www.linkedin.com/company/collaborative-robotics-lab-collab/

# Search engine ownership verification (rendered as meta tags by jekyll-seo-tag)
webmaster_verifications:
  google: HK2-6g44lnsXzzJMQ8js0uyaDG2nlSZBFX5EJV6ScJo

# Default social-preview image for every page (1200 x 630)
defaults:
  - scope:
      path: ""
    values:
      image: /images/front/og-image.jpg

date_format: "%b %-d, %Y"
header_pages:
 - people.html
 - research.html
 - publications.html
 - videos.html
 - values.html

show_social_icons: true
youtube_id: UCVUHS9JE0tSakziQFkThhVQ
linkedin: https://www.linkedin.com/company/collaborative-robotics-lab-collab/
photos: photos
wemet: wemet

# Build settings
markdown: kramdown
permalink: pretty
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
sass:
  style: compressed
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - node_modules
