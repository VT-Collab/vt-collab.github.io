# Site settings
title: Collab at Virginia Tech
tagline: Collaborative Robotics Lab
description: "Collaborative Robotics Lab at Virginia Tech. We create learning and control algorithms for robots that collaborate with people."
url: "https://collab.me.vt.edu"
baseurl: ""
lang: en
locale: en_US
logo: /images/logos/logo.png

# Used by jekyll-seo-tag for the Organization entry in structured data
