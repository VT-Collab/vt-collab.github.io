<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {%- if page.noindex %}
    <meta name="robots" content="noindex">
    {%- endif %}
    {% seo %}
    <link rel="manifest" href="{{ '/manifest.json' | relative_url }}">

    <!-- Fonts: TeX Gyre Pagella is self-hosted; preload the body weight -->
    <link rel="preload" href="{{ '/css/fonts/texgyrepagella-regular.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/css/fonts/texgyrepagella.css' | relative_url }}">

    <!-- Site CSS -->
    <link rel="stylesheet" href="{{ '/css/pixyll.css' | relative_url }}">
    {%- if page.extra_css %}
    <link rel="stylesheet" href="{{ page.extra_css | relative_url }}">
    {%- endif %}

    <!-- Icons used in the nav and buttons -->
    {%- if site.show_social_icons %}
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" integrity="sha512-SfTiTlX6kk+qitfevl/7LibUOeJWlt9rbyDn92a1DqWOw9vWG2MFoays0sgObmWazO5BQPiFucnnEAjpAB+/Sw==" crossorigin="anonymous">
    {%- endif %}

    <!-- Favicons -->
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ '/favicon-192x192.png' | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon-180x180.png' | relative_url }}">
</head>
