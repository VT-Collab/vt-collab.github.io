<div class="social-icons">
  <div class="social-icons-right">
    {%- if site.youtube_id %}
    <a class="fa fa-youtube-play" href="https://youtube.com/channel/{{ site.youtube_id }}" aria-label="Collab on YouTube"></a>
    {%- endif %}
    {%- if site.photos %}
    <a class="fa fa-camera" href="{{ site.photos | prepend: '/' | relative_url }}" aria-label="Lab photos"></a>
    {%- endif %}
    {%- if site.linkedin %}
    <a class="fa fa-linkedin" href="{{ site.linkedin }}" aria-label="Collab on LinkedIn"></a>
    {%- endif %}
    {%- if site.wemet %}
    <a class="fa fa-coffee" href="{{ site.wemet | prepend: '/' | relative_url }}" aria-label="WeMET"></a>
    {%- endif %}
  </div>
</div>
<div class="clearfix"></div>
