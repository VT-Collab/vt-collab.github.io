{%- for path in site.header_pages %}
  {%- assign item = site.pages | where: "path", path | first %}
  {%- if item.title %}
    {%- if item.hyperlink %}
          <a class="nav-link" target="_blank" rel="noopener" href="{{ item.hyperlink }}">{{ item.title }}</a>
    {%- elsif page.title == item.title %}
          <a class="nav-active" aria-current="page" href="{{ item.url | relative_url }}">{{ item.title }}</a>
    {%- else %}
          <a class="nav-link" href="{{ item.url | relative_url }}">{{ item.title }}</a>
    {%- endif %}
  {%- endif %}
{%- endfor %}
